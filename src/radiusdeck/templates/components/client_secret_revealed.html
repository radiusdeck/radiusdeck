<div id="{{ client_secret_dom_id }}"
     class="d-flex align-items-center gap-2"
     data-client-secret-container
     data-client-secret-revealed
     data-auto-hide-ms="30000">
  <code data-client-secret-value>{{ secret }}</code>
  <button type="button" class="btn btn-sm btn-outline-secondary" data-client-secret-copy>
    Copy
  </button>
  <button type="button" class="btn btn-sm btn-outline-secondary" data-client-secret-hide>
    Hide
  </button>
  <template data-client-secret-masked-template>
    {% include "components/client_secret_masked.html" %}
  </template>
</div>
