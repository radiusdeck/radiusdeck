<div id="{{ client_secret_dom_id }}"
     class="d-flex align-items-center gap-2"
     data-client-secret-container>
  <code class="text-body" aria-label="Shared secret hidden">************</code>
  {% if can_reveal_secret %}
  <button type="button"
          class="btn btn-sm btn-outline-secondary client-secret-icon-button"
          aria-label="Show shared secret"
          title="Show shared secret"
          hx-post="{{ client_secret_reveal_url }}"
          hx-vals='{{ {"surface": client_secret_surface} | tojson }}'
          hx-target="#{{ client_secret_dom_id }}"
          hx-swap="outerHTML">
    <i data-lucide="eye" aria-hidden="true"></i>
  </button>
  {% else %}
  <span class="text-muted small">Hidden</span>
  {% endif %}
</div>
