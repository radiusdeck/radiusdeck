<div id="{{ client_secret_dom_id }}"
     class="d-flex align-items-center gap-2"
     data-client-secret-container>
  <code class="text-body" aria-label="Shared secret hidden">************</code>
  {% if can_reveal_secret %}
  <button type="button"
          class="btn btn-sm btn-outline-secondary client-secret-icon-button"
          aria-label="Show shared secret"
          title="Show shared secret"
          hx-post="{{ client_secret_reveal_url }}"
          hx-vals='{{ {"surface": client_secret_surface} | tojson }}'
          hx-target="#{{ client_secret_dom_id }}"
          hx-swap="outerHTML">
    {# Lucide "eye" icon, ISC license; see THIRD-PARTY-NOTICES.md. #}
    <svg class="lucide lucide-eye" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
         viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
  </button>
  {% else %}
  <span class="text-muted small">Hidden</span>
  {% endif %}
</div>
