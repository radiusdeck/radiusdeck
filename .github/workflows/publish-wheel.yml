name: Publish Community 0.1.0 wheel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-community-wheel-v0.1.0
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v0.1.0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify the existing release source
        run: |
          test "$(git rev-parse HEAD)" = 0710de81e92969e9ce1c0ffa2af58c9b789626d2
          python - <<'PY'
          import pathlib
          import tomllib
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          assert project["project"]["name"] == "radiusdeck"
          assert project["project"]["version"] == "0.1.0"
          PY
      - name: Install validation tools
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -e .
      - name: Run quality and Community tests
        env:
          APP_ENV: test
        run: |
          make lint
          make test
      - name: Build and verify the wheel from the existing tag
        run: make test-community-artifact
      - name: Record asset checksums
        run: |
          cd dist/community
          sha256sum radiusdeck-*.whl community-installed-manifest.json > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: community-v0.1.0-wheel
          path: dist/community/
          if-no-files-found: error
          retention-days: 7

  attach-to-existing-release:
    needs: build-and-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: community-v0.1.0-wheel
          path: dist/community/
      - name: Attach missing assets without replacing existing files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist/community
          sha256sum --check SHA256SUMS
          gh release view v0.1.0
          # No --clobber: an existing asset must never be silently replaced.
          gh release upload v0.1.0 radiusdeck-*.whl \
            community-installed-manifest.json SHA256SUMS
          {
            printf '### Community v0.1.0 wheel assets\n\n'
            printf '~~~text\n'
            cat SHA256SUMS
            printf '~~~\n'
          } >> "$GITHUB_STEP_SUMMARY"
