name: Community CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt -e .
      - name: Lint
        run: ruff check src tests scripts/artifact_checks.py
      - name: Format check
        run: black --check src tests scripts/artifact_checks.py
      - name: Type check
        run: mypy src tests scripts/artifact_checks.py
      - name: Security lint
        run: bandit -q -r src

  unit-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt -e .
      - name: Community tests
        env:
          APP_ENV: test
        run: pytest tests -q

  community-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: make test-community-artifact

  community-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: make test-community-image
