name: Report a bug
description: Report a problem with RadiusDeck Community.
body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/radiusdeck/radiusdeck/issues?q=is%3Aissue), including closed ones, first.
        Please use English when possible and report one problem per issue.
        Issues are public: remove passwords, shared secrets, tokens, and private configuration from text and attachments.
        For suspected vulnerabilities, follow [SECURITY.md](https://github.com/radiusdeck/radiusdeck/blob/main/SECURITY.md).
        See [Getting help](https://github.com/radiusdeck/radiusdeck/blob/main/SUPPORT.md) for guidance.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the actions that lead to the problem. If it is intermittent, explain what happened before it occurred.
      placeholder: |
        1. Start RadiusDeck with...
        2. Open...
        3. Click...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the exact error message if available, with sensitive information removed.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RadiusDeck version
      description: Release version, Docker image tag, or source commit. Write "unknown" if you cannot find it.
      placeholder: e.g. ghcr.io/radiusdeck/radiusdeck:0.1.0
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Docker
        - Docker Compose
        - Local Python process
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment (optional)
      description: Include relevant details such as host OS, browser for UI issues, or FreeRADIUS version and reload method for authentication issues. For other installation methods, explain how you run RadiusDeck.
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots (optional)
      description: Share only relevant excerpts or screenshots after removing sensitive information. Avoid complete configurations, .env files, backups, or full docker inspect output.
