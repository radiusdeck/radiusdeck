# Minimal FreeRADIUS 3.x PAP demo. All requests stay on loopback.
name = radiusdeck-demo
prefix = /usr
libdir = $ENV{DEMO_RADIUS_LIBDIR}
raddbdir = $ENV{DEMO_STATE}/config
run_dir = $ENV{DEMO_STATE}
logdir = $ENV{DEMO_STATE}
pidfile = ${run_dir}/radius.pid
max_request_time = 10
cleanup_delay = 1
max_requests = 256
hostname_lookups = no
log {
    destination = stdout
    auth = yes
    auth_badpass = no
    auth_goodpass = no
}
security {
    max_attributes = 200
    reject_delay = 0
    status_server = no
}
$INCLUDE clients.conf
modules {
    files {
        filename = ${raddbdir}/users
    }
    pap {
        normalise = yes
    }
}
server demo {
    listen {
        type = auth
        ipaddr = 127.0.0.1
        port = 18120
    }
    authorize {
        files
        pap
    }
    authenticate {
        Auth-Type PAP {
            pap
        }
    }
}
